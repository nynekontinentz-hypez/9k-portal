<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9K Portal — Admin Login</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#080808; color:#F0EDE8; font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { width:100%; max-width:360px; padding:2rem; }
.logo { font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; color:#E68C14; margin-bottom:0.25rem; }
.sub { color:#66615C; font-size:0.8rem; margin-bottom:2.5rem; }
h2 { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:800; margin-bottom:1.5rem; }
.form-group { margin-bottom:1rem; }
label { font-family:'IBM Plex Mono',monospace; font-size:0.58rem; letter-spacing:.12em; text-transform:uppercase; color:#66615C; display:block; margin-bottom:0.4rem; }
input { width:100%; background:#111; border:0.5px solid rgba(255,255,255,0.13); color:#F0EDE8; padding:0.6rem 0.75rem; font-size:0.875rem; outline:none; }
input:focus { border-color:#E68C14; }
button { width:100%; padding:0.6rem 1.1rem; background:#E68C14; color:#080808; border:none; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; margin-top:0.5rem; }
button:hover { background:#F5A020; }
.error { color:#E84444; font-size:0.78rem; margin-top:0.5rem; display:none; }
.error.show { display:block; }
.hint { font-family:'IBM Plex Mono',monospace; font-size:0.6rem; color:#66615C; margin-top:1.25rem; padding:0.75rem; border:0.5px solid rgba(255,255,255,0.07); line-height:1.6; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">9K PORTAL</div>
  <div class="sub">Admin Dashboard</div>
  <h2>Sign in</h2>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" value="admin@9ksystems.net" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button type="submit">Sign In</button>
    <div class="error" id="loginErr">Invalid credentials. Try again.</div>
  </form>
  <div class="hint">Demo: admin@9ksystems.net / admin9kos</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('loginErr');
  err.classList.remove('show');
  try {
    const r = await fetch('/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const d = await r.json();
    if (!r.ok || !d.success) { err.classList.add('show'); return; }
    window.location.href = '/admin';
  } catch { err.textContent = 'Connection error.'; err.classList.add('show'); }
});
</script>
</body>
</html>
